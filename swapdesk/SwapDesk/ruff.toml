# Ruff configuration.
#
# This file exists because CI installed ruff unpinned and ran it with no
# config, so the rule set was whatever that version happened to default to.
# The visible symptom: 13 correct `# noqa: BLE001 / F401 / DTZ007` comments in
# the tree started being reported as UNUSED noqa directives, because the rules
# they silence weren't enabled in the default set. Deleting those comments to
# quiet the warning would have been backwards, they document deliberate
# decisions. Enabling the rules they refer to is the actual fix.
#
# Pair this with the pinned ruff version in .github/workflows/ci.yml. Config
# without a pin still drifts on the next ruff release.

line-length = 100
target-version = "py312"

exclude = [".venv", "venv", "build", "dist", "__pycache__"]

[lint]
# The advisory pass. Deliberately not "everything": each family here either
# catches a real defect or is a rule the tree already honours.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "B",      # bugbear
    "BLE",    # blind-except  (silenced case-by-case with a reason; see below)
    "DTZ",    # naive datetimes, which is a real hazard in prune_history
    "RUF",
]

ignore = [
    # The four `from theme import *` sites are the design-system import. The
    # alternative is naming ~40 palette/font/helper symbols at the top of each
    # of five UI modules and re-editing all five whenever one is added. The
    # star import is the deliberate choice; F403/F405 exist to flag it, and
    # flagging it 200 times doesn't make it more deliberate.
    "F403", "F405",
    # E501 is advisory here: the tree wraps at a comfortable width already and
    # the overruns are mostly long URLs and regexes in comments, which don't
    # get more readable when split.
    "E501",
    # This codebase favours long explanatory comments over short ones. B905's
    # strict= requirement on zip() is fine, but B008 and B006 fire on
    # customtkinter call patterns that are correct as written.
    "B008",
    # B904 (raise ... from err inside except) is a fair point and there are 10
    # sites. Left off deliberately rather than silently: chaining them is a
    # real change to real error paths and wants its own commit with its own
    # testing, not a drive-by during a release pass. Tracked, not forgotten.
    "B904",
    # E402: app.py sets the CustomTkinter appearance mode before the design
    # system star-import on purpose, and providers/__init__.py orders its
    # imports by role with a docstring saying so. Both are commented where
    # they happen. Import-order rules (I001) are off for the same reason.
    "E402",
]
